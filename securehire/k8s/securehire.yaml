# SecureHire — Kubernetes Manifests
# CYC386 Requirement: K8s + Pod Security Standards + Network Policies
# Apply: kubectl apply -f k8s/securehire.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: securehire
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: securehire-config
  namespace: securehire
data:
  APP_ENV: "production"
  DEBUG: "False"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis-service:6379"

---
# Secret (in production: use Vault CSI driver)
apiVersion: v1
kind: Secret
metadata:
  name: securehire-secrets
  namespace: securehire
type: Opaque
stringData:
  JWT_SECRET_KEY: "CYC386-jwt-secret-production"
  AES_SECRET_KEY: "CYC386-aes-256-key-securehire-2026"
  AES_IV: "CYC386-aes-iv!!"
  DATABASE_URL: "postgresql+asyncpg://securehire:securehire123@postgres-service:5432/securehire_db"
  SECRET_KEY: "CYC386-super-secret-key-production"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securehire-backend
  namespace: securehire
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pod Security — CIS Kubernetes Benchmark
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: securehire-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # logs dir needs write
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: securehire-config
            - secretRef:
                name: securehire-secrets

          # Resource limits (prevent resource exhaustion attacks)
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: securehire
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

---
# Network Policy — Zero Trust: deny all, allow only needed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: securehire
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092

---
# Kyverno Policy — enforce non-root containers
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securehire-require-nonroot
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-run-as-non-root
      match:
        resources:
          kinds: [Pod]
          namespaces: [securehire]
      validate:
        message: "Containers must run as non-root"
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: disallow-privileged
      match:
        resources:
          kinds: [Pod]
          namespaces: [securehire]
      validate:
        message: "Privileged containers not allowed"
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: "false"
