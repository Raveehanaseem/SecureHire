name: SecureHire DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - Testing
  pull_request:
    branches:
      - main

# Global default — least privilege
permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sort

  sast:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    needs: validate-structure
    # CodeQL needs these two permissions to upload SARIF results
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: results
          upload: always

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: validate-structure
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.backend \
            -t securehire-backend:test \
            securehire/src/backend

      - name: Run Trivy Scan (table — visible in logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securehire-backend:test
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy Scan (SARIF — uploads to Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securehire-backend:test
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: validate-structure
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securehire
          POSTGRES_PASSWORD: securehire123
          POSTGRES_DB: securehire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
          REDIS_URL: redis://localhost:6379
        run: |
          if [ -d securehire/tests ]; then
            pytest securehire/tests -v || true
          else
            echo "No tests directory found - skipping"
          fi

  blue-team:
    name: Blue Team Validation
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Containers
        run: |
          cd securehire/docker
          docker compose up -d || true
          echo "Waiting 30s for services to start..."
          sleep 30

      - name: Health Check
        run: |
          curl -sf http://localhost:8000/health || echo "Health check failed"

      - name: Simulate Attacks
        run: |
          echo "=== SQL Injection Test ==="
          curl -s "http://localhost:8000/api/v1/jobs/?skip=0%20OR%201=1" || true
          echo "=== XSS Test ==="
          curl -s "http://localhost:8000/api/v1/jobs/?q=<script>alert(1)</script>" || true
          echo "=== Unauth Access Test ==="
          curl -s http://localhost:8000/api/v1/jobs/pending || true

      - name: Check Security Logs
        run: |
          docker ps -a
          docker logs securehire-backend 2>&1 | grep -i \
            'SQL injection\|XSS\|403\|429\|WARNING' || true

      - name: Tear Down
        if: always()
        run: |
          cd securehire/docker
          docker compose down || true

  dast:
    name: DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      security-events: write
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securehire
          POSTGRES_PASSWORD: securehire123
          POSTGRES_DB: securehire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      # Start only the backend directly (no Docker-in-Docker complexity)
      - name: Start Backend Server
        env:
          DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: zap-test-secret-key-not-for-production
          DEBUG: "false"
        run: |
          cd securehire/src/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && echo "Backend is up!" && break
            echo "Attempt $i/20 — retrying in 3s..."
            sleep 3
          done

      # Seed a test user so ZAP can reach authenticated endpoints
      - name: Seed Test User
        run: |
          curl -s -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{
              "email": "zap@securehire.test",
              "password": "Zap@Test123",
              "full_name": "ZAP Scanner",
              "role": "applicant"
            }' || true
          echo "Test user seeded"

      # Fetch a JWT token and write ZAP context file for authenticated scan
      - name: Generate ZAP Auth Context
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8000/api/v1/auth/login \
            -d 'username=zap@securehire.test&password=Zap@Test123' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          echo "ZAP_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "Token captured (length: ${#TOKEN})"

      # ── Baseline scan — passive only, no active attacks ──────────────────
      # Good for PRs: fast (~2 min), zero false-positive risk
      - name: ZAP Baseline Scan (passive)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          cmd_options: >-
            -z "-config replacer.full_list(0).description=auth
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=Authorization
                -config replacer.full_list(0).replacement=Bearer__ZAP_AUTH_HEADER_VALUE__"
          allow_issue_writing: false
          fail_action: false

      # ── Full API scan using OpenAPI spec ─────────────────────────────────
      # Targets every documented endpoint with the JWT token injected
      - name: ZAP Full API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: http://localhost:8000/api/openapi.json
          format: openapi
          cmd_options: >-
            -z "-config replacer.full_list(0).description=auth
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=Authorization
                -config replacer.full_list(0).replacement=Bearer ${{ env.ZAP_TOKEN }}"
          allow_issue_writing: false
          fail_action: false

      # Upload ZAP SARIF report to GitHub Security tab
      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results/zap-scan-results.sarif
          category: zap-dast

      # Save full HTML report as a downloadable artifact
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_json.json
            results/
          retention-days: 30

      - name: Summarise ZAP Findings
        if: always()
        run: |
          echo "## ZAP DAST Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | http://localhost:8000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Spec   | /api/openapi.json |" >> $GITHUB_STEP_SUMMARY
          echo "| Report | See artifact: zap-dast-report |" >> $GITHUB_STEP_SUMMARY
          if [ -f report_json.json ]; then
            HIGH=$(python3 -c "import json; d=json.load(open('report_json.json')); \
              print(sum(1 for s in d.get('site',[]) for a in s.get('alerts',[]) if a.get('riskcode') in ['3','2']))" 2>/dev/null || echo "N/A")
            echo "| High/Medium alerts | $HIGH |" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - sast
      - trivy
      - test-backend
      - dast
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.backend \
            -t securehire-backend:latest \
            securehire/src/backend

      - name: Build Frontend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.frontend \
            -t securehire-frontend:latest \
            securehire/src/frontend

      - name: Verify Images
        run: |
          docker images | grep securehire
