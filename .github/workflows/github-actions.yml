name: SecureHire DevSecOps Pipeline

on:
push:
branches:
- main
- develop
- Testing

pull_request:
branches:
- main

jobs:

# =====================================================

# Repository Validation

# =====================================================

validate-structure:
name: Validate Repository Structure
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Show Repository Structure
    run: |
      pwd
      ls -la
      find . -maxdepth 3 -type d | sort
```

# =====================================================

# SAST - CodeQL

# =====================================================

sast:
name: SAST - CodeQL Analysis
runs-on: ubuntu-latest
needs: validate-structure

```
steps:
  - uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Backend Dependencies
    run: |
      cd securehire/src/backend
      pip install -r requirements.txt

  - name: Initialize CodeQL
    uses: github/codeql-action/init@v3
    with:
      languages: python,javascript

  - name: Autobuild
    uses: github/codeql-action/autobuild@v3

  - name: Analyze
    uses: github/codeql-action/analyze@v3
```

# =====================================================

# Trivy Container Scan

# =====================================================

trivy:
name: Container Security Scan
runs-on: ubuntu-latest
needs: validate-structure

```
steps:
  - uses: actions/checkout@v4

  - name: Build Backend Image
    run: |
      docker build \
      -f securehire/docker/Dockerfile.backend \
      -t securehire-backend:test \
      securehire/src/backend

  - name: Run Trivy Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: securehire-backend:test
      format: table
      exit-code: 1
      severity: CRITICAL,HIGH
```

# =====================================================

# Backend Testing

# =====================================================

test-backend:
name: Backend Tests
runs-on: ubuntu-latest
needs: validate-structure

```
services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: securehire
      POSTGRES_PASSWORD: securehire123
      POSTGRES_DB: securehire_db
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

steps:
  - uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Dependencies
    run: |
      cd securehire/src/backend
      pip install -r requirements.txt

  - name: Run Backend Tests
    env:
      DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: test-secret
    run: |
      pytest securehire/tests -v || true
```

# =====================================================

# Blue Team Security Validation

# =====================================================

blue-team:
name: Blue Team Validation
runs-on: ubuntu-latest
needs: test-backend

```
steps:
  - uses: actions/checkout@v4

  - name: Start SecureHire Stack
    run: |
      cd securehire/docker
      docker compose up -d postgres redis backend
      sleep 30

  - name: Simulate Security Attacks
    run: |
      for i in {1..20}; do
        curl -s -X POST http://localhost:8000/api/v1/auth/login \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=test&password=wrong$i"
      done

      curl -s "http://localhost:8000/api/v1/jobs?search=<script>alert(1)</script>" || true

  - name: Check Security Logs
    run: |
      docker logs securehire_backend 2>&1 | \
      grep -i "RISK\|HIGH_RISK\|429\|WARNING" || true

  - name: Verify Health Endpoint
    run: |
      curl -f http://localhost:8000/health
```

# =====================================================

# Build Images

# =====================================================

build:
name: Build Docker Images
runs-on: ubuntu-latest

```
needs:
  - sast
  - trivy
  - test-backend

steps:
  - uses: actions/checkout@v4

  - name: Build Backend
    run: |
      docker build \
      -f securehire/docker/Dockerfile.backend \
      -t securehire-backend:latest \
      securehire/src/backend

  - name: Build Frontend
    run: |
      docker build \
      -f securehire/docker/Dockerfile.frontend \
      -t securehire-frontend:latest \
      securehire/src/frontend

  - name: Verify Images
    run: |
      docker images | grep securehire
```
