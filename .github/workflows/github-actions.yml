name: SecureHire DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - Testing
  pull_request:
    branches:
      - main

# Global default — least privilege
permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sort

  sast:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    needs: validate-structure
    # CodeQL needs these two permissions to upload SARIF results
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: results
          upload: always

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: validate-structure
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.backend \
            -t securehire-backend:test \
            securehire/src/backend

      - name: Run Trivy Scan (table — visible in logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securehire-backend:test
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy Scan (SARIF — uploads to Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: securehire-backend:test
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: validate-structure
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securehire
          POSTGRES_PASSWORD: securehire123
          POSTGRES_DB: securehire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
          REDIS_URL: redis://localhost:6379
        run: |
          if [ -d securehire/tests ]; then
            pytest securehire/tests -v || true
          else
            echo "No tests directory found - skipping"
          fi

  blue-team:
    name: Blue Team Validation
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Containers
        run: |
          cd securehire/docker
          docker compose up -d || true
          echo "Waiting 30s for services to start..."
          sleep 30

      - name: Health Check
        run: |
          curl -sf http://localhost:8000/health || echo "Health check failed"

      - name: Simulate Attacks
        run: |
          echo "=== SQL Injection Test ==="
          curl -s "http://localhost:8000/api/v1/jobs/?skip=0%20OR%201=1" || true
          echo "=== XSS Test ==="
          curl -s "http://localhost:8000/api/v1/jobs/?q=<script>alert(1)</script>" || true
          echo "=== Unauth Access Test ==="
          curl -s http://localhost:8000/api/v1/jobs/pending || true

      - name: Check Security Logs
        run: |
          docker ps -a
          docker logs securehire-backend 2>&1 | grep -i \
            'SQL injection\|XSS\|403\|429\|WARNING' || true

      - name: Tear Down
        if: always()
        run: |
          cd securehire/docker
          docker compose down || true

  dast:
    name: DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      security-events: write
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securehire
          POSTGRES_PASSWORD: securehire123
          POSTGRES_DB: securehire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          cd securehire/src/backend
          pip install -r requirements.txt

      # Start only the backend directly (no Docker-in-Docker complexity)
      - name: Start Backend Server
        env:
          DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: zap-test-secret-key-not-for-production
          DEBUG: "false"
        run: |
          cd securehire/src/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && echo "Backend is up!" && break
            echo "Attempt $i/20 — retrying in 3s..."
            sleep 3
          done

      # Seed a test user so ZAP can reach authenticated endpoints
      - name: Seed Test User
        run: |
          curl -s -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{
              "email": "zap@securehire.test",
              "password": "Zap@Test123",
              "full_name": "ZAP Scanner",
              "role": "applicant"
            }' || true
          echo "Test user seeded"

      # Fetch a JWT token and write ZAP context file for authenticated scan
      - name: Generate ZAP Auth Context
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8000/api/v1/auth/login \
            -d 'username=zap@securehire.test&password=Zap@Test123' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          echo "ZAP_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "Token captured (length: ${#TOKEN})"

      # ── Create output directory (ZAP writes reports here) ────────────────
      - name: Prepare ZAP Output Directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      # ── Baseline scan — passive only, runs ZAP directly via Docker ────────
      # Bypasses the zaproxy/action-baseline artifact-naming bug entirely.
      # Uses host networking so ZAP container can reach localhost:8000.
      - name: ZAP Baseline Scan (passive)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/.zap:/zap/wrk/.zap:ro" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/reports" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8000 \
              -r reports/baseline-report.html \
              -J reports/baseline-report.json \
              -x reports/baseline-report.xml \
              -c .zap/rules.tsv \
              -z "-config replacer.full_list(0).description=auth \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Authorization \
                  -config replacer.full_list(0).replacement='Bearer ${{ env.ZAP_TOKEN }}'" \
              -I || true
          echo "Baseline scan complete"

      # ── Full API scan — active, uses OpenAPI spec ─────────────────────────
      - name: ZAP Full API Scan (active)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/.zap:/zap/wrk/.zap:ro" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/reports" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://localhost:8000/api/openapi.json \
              -f openapi \
              -r reports/api-scan-report.html \
              -J reports/api-scan-report.json \
              -x reports/api-scan-report.xml \
              -c .zap/rules.tsv \
              -z "-config replacer.full_list(0).description=auth \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Authorization \
                  -config replacer.full_list(0).replacement='Bearer ${{ env.ZAP_TOKEN }}'" \
              -I || true
          echo "API scan complete"

      # ── Convert XML report to SARIF for GitHub Security tab ──────────────
      - name: Convert ZAP XML to SARIF
        if: always()
        run: |
          pip install zaproxy --quiet
          python3 - << 'EOF'
          import json, xml.etree.ElementTree as ET, os

          def xml_to_sarif(xml_path, output_path):
              if not os.path.exists(xml_path):
                  print(f"Skipping {xml_path} — file not found")
                  return
              tree = ET.parse(xml_path)
              root = tree.getroot()
              rules, results = [], []
              for alert in root.iter('alertitem'):
                  rule_id  = alert.findtext('pluginid', 'unknown')
                  name     = alert.findtext('alert', 'Unknown Alert')
                  desc     = alert.findtext('desc', '')
                  solution = alert.findtext('solution', '')
                  risk     = alert.findtext('riskcode', '0')
                  level    = {'3':'error','2':'warning','1':'note','0':'none'}.get(risk,'warning')
                  uri      = alert.findtext('uri', 'http://localhost:8000')
                  rules.append({
                      "id": rule_id,
                      "name": name.replace(' ','-'),
                      "shortDescription": {"text": name},
                      "fullDescription": {"text": desc},
                      "help": {"text": solution, "markdown": solution},
                      "properties": {"security-severity": {'3':'9.0','2':'6.5','1':'3.0','0':'0.0'}.get(risk,'5.0')}
                  })
                  results.append({
                      "ruleId": rule_id,
                      "level": level,
                      "message": {"text": f"{name}: {desc[:200]}"},
                      "locations": [{"physicalLocation": {"artifactLocation": {"uri": uri}}}]
                  })
              sarif = {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{"tool": {"driver": {"name":"OWASP ZAP","rules": rules}}, "results": results}]
              }
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, 'w') as f:
                  json.dump(sarif, f, indent=2)
              print(f"SARIF written to {output_path} ({len(results)} findings)")

          xml_to_sarif('zap-reports/reports/api-scan-report.xml', 'zap-reports/zap-api.sarif')
          xml_to_sarif('zap-reports/reports/baseline-report.xml', 'zap-reports/zap-baseline.sarif')
          EOF

      # ── Upload SARIF to GitHub Security tab ───────────────────────────────
      - name: Upload ZAP API Scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-reports/zap-api.sarif
          category: zap-api-scan

      - name: Upload ZAP Baseline SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-reports/zap-baseline.sarif
          category: zap-baseline

      # ── Save HTML + JSON reports as artifact ─────────────────────────────
      - name: Upload ZAP Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: securehire-zap-dast-reports
          path: zap-reports/reports/
          retention-days: 30
          if-no-files-found: warn

      # ── Print summary to GitHub Actions job summary page ─────────────────
      - name: ZAP Scan Summary
        if: always()
        run: |
          echo "## OWASP ZAP DAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Baseline (passive) | \`zap-reports/reports/baseline-report.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Scan (active)  | \`zap-reports/reports/api-scan-report.html\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SARIF              | GitHub Security tab → Code Scanning |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in zap-reports/reports/*.json; do
            [ -f "$f" ] || continue
            COUNT=$(python3 -c "
          import json, sys
          d = json.load(open('$f'))
          alerts = [a for s in d.get('site',[]) for a in s.get('alerts',[])]
          high   = sum(1 for a in alerts if a.get('riskcode') == '3')
          med    = sum(1 for a in alerts if a.get('riskcode') == '2')
          low    = sum(1 for a in alerts if a.get('riskcode') == '1')
          print(f'High={high} Medium={med} Low={low}')
          " 2>/dev/null || echo "parse error")
            echo "**$(basename $f)**: $COUNT" >> $GITHUB_STEP_SUMMARY
          done

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - sast
      - trivy
      - test-backend
      - dast
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.backend \
            -t securehire-backend:latest \
            securehire/src/backend

      - name: Build Frontend Image
        run: |
          docker build \
            -f securehire/docker/Dockerfile.frontend \
            -t securehire-frontend:latest \
            securehire/src/frontend

      - name: Verify Images
        run: |
          docker images | grep securehire
