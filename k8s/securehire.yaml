apiVersion: v1
kind: Namespace
metadata:
  name: securehire
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: securehire-config
  namespace: securehire
data:
  APP_ENV: "production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: securehire-secrets
  namespace: securehire
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://securehire:securehire123@postgres:5432/securehire_db"
  JWT_SECRET_KEY: "KWyDX7OaToaoT3d9S20qp_QavB7yWH_N2EGWeyrD7Pc0IOB5Nb63G5FwaVGukNuL"
  SECRET_KEY: "cMgyyjHu3rDMoWCD2Pn8Z0uif6qpQYJuEFm9JOHDRgwkK9p_kfoQXoBvV7Kgz8y4"
  AES_SECRET_KEY: "42dbe67e7df027cbcf3e1cfbea67e7b2"
  AES_IV: "0e678e0281a0a719"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securehire-backend
  namespace: securehire
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: docker-backend:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: securehire-config
            - secretRef:
                name: securehire-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: securehire
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: securehire
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
  egress:
    - {}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securehire-require-nonroot
spec:
  validationFailureAction: Audit
  rules:
    - name: autogen-disallow-privileged
      match:
        resources:
          kinds:
            - Pod
      validate:
        message: "Privileged containers not allowed."
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: false
