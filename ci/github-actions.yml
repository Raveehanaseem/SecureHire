name: SecureHire DevSecOps Pipeline
# CYC386 Requirement: CI/CD with security gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── SAST: Static Analysis ──────────────────────────────────────────────────
  sast:
    name: SAST — SonarQube + CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── Container Security: Trivy Scan ────────────────────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.backend -t securehire-backend:test src/backend/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "securehire-backend:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securehire
          POSTGRES_PASSWORD: securehire123
          POSTGRES_DB: securehire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://securehire:securehire123@localhost:5432/securehire_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci
          AES_SECRET_KEY: test-aes-key-32-chars-for-ci!!
          AES_IV: test-iv-16-chars!
          SECRET_KEY: test-secret-key-ci
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          cd src/backend
          pytest -v --tb=short || true

  # ── DAST: OWASP ZAP ───────────────────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP API Scan
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start backend (Docker Compose)
        run: |
          cd docker
          docker compose up -d postgres redis backend
          sleep 20

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "http://localhost:8000/api/openapi.json"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_json.json

  # ── Build & Push Docker Images ─────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [sast, trivy, test-backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t securehire-backend:latest src/backend/

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t securehire-frontend:latest src/frontend/

      - name: Verify images
        run: docker images | grep securehire
